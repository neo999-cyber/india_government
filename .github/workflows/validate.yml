name: validate

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow reads the repository and publishes nothing.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` IS LOAD-BEARING AND NOT A PERFORMANCE CHOICE.
      #
      # The default shallow clone made `quotation-identity` skip — it says so on stdout and exits 0
      # — so every CI run since that gate was written passed WITHOUT testing whether a correction
      # still quotes what it withdrew, and a green tick did not distinguish that from a run which
      # had tested it. `record-history` and `corrections` reuse committed files in a shallow clone
      # rather than reconstructing them, with the same result. Found by an external audit, not here.
      # Pinned to an immutable commit, not a mutable tag: `@v7` is a moving target and a
      # compromised tag would run arbitrary code with this repository checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — Node 24 runtime
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 — Node 24 runtime
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The gate itself, then the proof that the gate is closed.
      - run: npm run validate
      - run: npm run validate:selftest
      - run: npm run typecheck
      # LINT IS A CI STEP AND NOT A BUILD STEP. The build gates the CORPUS and the rendered output
      # and is paid for on every commit and every Vercel deploy; lint findings are code-quality
      # signals about source `typecheck` has already proven type-correct. Same judgement, same
      # reason, as the e2e suite below.
      - run: npm run lint
      - run: npm run build

      # THE SKIP IS NOW FATAL HERE, AND ONLY HERE. Vercel clones shallow and structurally cannot
      # run this, so the gate keeps its skip for the deploy; CI has the history and must prove it.
      - run: node tools/quotation-identity.mjs --require-history

      # END-TO-END, AND DELIBERATELY NOT PART OF `npm run build`.
      #
      # These properties need a browser with layout: a count that updates when a facet is
      # clicked, a rendered target size, keyboard reach into a scrolling region, and horizontal
      # overflow at responsive widths, plus touch/mobile contexts under Chromium and WebKit.
      # `tools/interface-invariants.mjs` states in its own header that it cannot bind them, and this
      # is what does.
      #
      # It is not in the build chain because the build runs on Vercel, which has no browser
      # binaries — the same reason `tools/deploy-check.mjs` stays out. Here the browser caches
      # between runs. It runs AFTER the build because it serves `out/`.
      # Chromium covers desktop and Android profiles; WebKit exercises both iPhone profiles.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e

      # A BUILD THAT REWRITES A TRACKED FILE AND LEAVES IT UNCOMMITTED IS A SILENT DRIFT.
      # Nothing previously looked. This is not a hypothetical: the generated-documentation stamp is
      # derived from git history, so a clone without that history produces different bytes — which
      # is exactly the failure mode `fetch-depth: 0` above prevents, and this catches if it returns.
      - name: generated files must match the committed ones
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::the build modified tracked files — commit the regenerated output or fix the generator"
            exit 1
          fi
