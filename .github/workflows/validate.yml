name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The gate itself, then the proof that the gate is closed.
      - run: npm run validate
      - run: npm run validate:selftest
      - run: npm run typecheck
      - run: npm run build
